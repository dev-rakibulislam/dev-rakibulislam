</linearGradient>
<linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9fff0"/></linearGradient>
<clipPath id="r"><rect width="1000" height="260" rx="18"/></clipPath>
</defs>
<g clip-path="url(#r)">
